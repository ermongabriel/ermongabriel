name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ermongabriel
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: actions/checkout@v4
        with:
          ref: output
      - run: cp -r dist/* .
      - uses: EndBug/add-and-commit@v9
        with:
          branch: output
          message: "Update snake animation"